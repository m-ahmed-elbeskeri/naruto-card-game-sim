name: Network experiment matches

# Head to head between the networks trained offline in tools/exp (train.py: the current design from scratch,
# the same with per-unit inputs, and two transformers, all on the same 3,019 self-play games), and the current
# design from scratch against the training champion. Each job plays 4 processes in parallel; the last job adds
# them up per pairing.
on:
  workflow_dispatch:
    inputs:
      sims:
        description: Search simulations per world for both players (8 worlds)
        default: '24'

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: units-v-mlp-1, a: tools/exp/units.json, b: tools/exp/mlp.json, games: 50, seed: 1 }
          - { name: units-v-mlp-2, a: tools/exp/units.json, b: tools/exp/mlp.json, games: 50, seed: 2 }
          - { name: tfs-v-mlp-1, a: tools/exp/tfs.json, b: tools/exp/mlp.json, games: 25, seed: 3 }
          - { name: tfs-v-mlp-2, a: tools/exp/tfs.json, b: tools/exp/mlp.json, games: 25, seed: 4 }
          - { name: tf-v-mlp-1, a: tools/exp/tf.json, b: tools/exp/mlp.json, games: 25, seed: 5 }
          - { name: tf-v-mlp-2, a: tools/exp/tf.json, b: tools/exp/mlp.json, games: 25, seed: 6 }
          - { name: mlp-v-gen18, a: tools/exp/mlp.json, b: ai/best.json, games: 50, seed: 7 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          for i in 1 2 3 4; do node tools/exp/play.js "$A" "$B" "$GAMES" $(( SEED * 10 + i )) sims="$SIMS" > "r-$i.json" & done
          wait
          cat r-*.json
        env:
          A: ${{ matrix.a }}
          B: ${{ matrix.b }}
          GAMES: ${{ matrix.games }}
          SEED: ${{ matrix.seed }}
          SIMS: ${{ inputs.sims }}
      - uses: actions/upload-artifact@v4
        with:
          name: m-${{ matrix.name }}
          path: r-*.json
          retention-days: 7

  total:
    needs: play
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: m
          pattern: m-*
      - run: |
          node -e '
          const fs = require("fs"), path = require("path"), t = {};
          for (const d of fs.readdirSync("m")) for (const f of fs.readdirSync(path.join("m", d))) {
            const txt = fs.readFileSync(path.join("m", d, f), "utf8").trim(); if (!txt) continue;
            const r = JSON.parse(txt), k = `${r.a} v ${r.b}`, x = t[k] = t[k] || { w: 0, n: 0, by: {} };
            x.w += r.wins; x.n += r.games;
            for (const [m, [w, n]] of Object.entries(r.by)) { const y = x.by[m] = x.by[m] || [0, 0]; y[0] += w; y[1] += n; }
          }
          for (const [k, x] of Object.entries(t)) {
            const p = x.w / x.n, ci = 196 * Math.sqrt(p * (1 - p) / x.n);
            const line = `${k}: ${(100 * p).toFixed(1)}% +-${ci.toFixed(1)} over ${x.n} games | ` + Object.entries(x.by).map(([m, [w, n]]) => `${m} ${Math.round(100 * w / n)}% (${n})`).join(" / ");
            console.log("EXP RESULT " + line);
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n\n");
          }'
