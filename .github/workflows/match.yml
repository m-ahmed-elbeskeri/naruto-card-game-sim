name: Hokage match

# Plays the trained champion (ai/best.json) against the network the site ships (js/az-weights.js) and reports the
# champion's score. Nothing is committed: shipping a new generation stays a decision made by hand.
on:
  workflow_dispatch:
    inputs:
      games:
        description: Games to play
        default: '800'
      b:
        description: Opponent (a weights file, or kage for the heuristic)
        default: js/az-weights.js
      mix:
        description: Share of mirror matches (red v red, blue v blue); the rest is red v blue
        default: '0.5'

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/az-ci.js match games="$GAMES" b="$B" mix="$MIX"
        env:
          GAMES: ${{ inputs.games }}
          B: ${{ inputs.b }}
          MIX: ${{ inputs.mix }}
